# 1. Entity-type definitions — what each extractor collects
definitions:
  medications: any medication or treatment administered to the patient during this encounter
  interventions: a procedure performed on the patient during this encounter, the procedure is restricted to a set of categories
  vital_signs: a measurement of the body's essential physiological functions
  mechanism_of_injury: the environmental or physical forces that acted upon one or multiple body parts to produce trauma
  demographics: the patient's age, sex, height, and weight
  medical_history: the patient's past medical history and past medications, their family's medical history, and the conditions and symptoms the patient already has before the injury
  patient_condition: the patient's current state as assessed during this encounter, from the injury and what it causes - the symptoms they report, their mental status, the abnormal findings of the crew's assessment, and the injuries the crew suspects

# 2. Fields — one section per extractor, <category>_fields, named after its prompt
#    (separated/<category>.txt). Each entry is a field the extractor reports, and becomes the
#    placeholder {<field>} in that prompt only.

medications_fields:
  entity: "the name used in the transcript (\"ket\", \"levo\")"
  standard_name: "the medication's generic name in standard clinical terms (\"ketamine\" for \"ket\", \"norepinephrine\" for \"noradrenaline\" or \"levo\")"
  ref: "the id of the administration in the previous extractions that the action is about (\"ketamine-2\")"
  dose: "the total amount given at once, the number alone as a JSON number, without its unit; not a rate"
  dose_unit: "the dose's unit as stated (\"mg\", \"mcg\", \"g\", \"mL\", \"units\"); leave it out when not stated"
  rate: "the speed of an infusion, the number alone as a JSON number, without its unit"
  rate_unit: "the rate's unit as stated (\"mg/kg/h\", \"mcg/kg/min\", \"mcg/min\", \"mL/h\"); leave it out when not stated"
  route: "how the medication enters the body: one of the routes below, by its full name; leave it out when not stated"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported"

interventions_fields:
  entity: "the procedure performed, in standard clinical terms (\"endotracheal intubation\", \"intraosseous access\", \"transcutaneous pacing\")"
  category: "its category from the list above"
  details: "its details as stated, such as the device, size, site or settings (\"size 8.0, 22 at the lips\", \"right tibia\", \"rate 70, 80 mA\"), and for a scan or test its findings (\"pericardial effusion, no tamponade\"); leave it out when none are stated"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported"

vital_signs_fields:
  entity: "its name from the list above"
  value: "the number alone, as a JSON number, without its unit; an approximate value (\"about 80\") is its number; not for blood_pressure"
  systolic: "for blood_pressure only, instead of value: the systolic pressure, the first number of a blood pressure (\"146 over 101\" is 146), as a JSON number, higher than the diastolic"
  diastolic: "for blood_pressure only, instead of value: the diastolic pressure, the second number of a blood pressure (\"146 over 101\" is 101), as a JSON number"
  eye: "for gcs only, besides value: the eye score (1-4), as a whole JSON number, when stated (\"E2 V3 M4\" is eye 2)"
  verbal: "for gcs only, besides value: the verbal score (1-5), as a whole JSON number, when stated (\"E2 V3 M4\" is verbal 3)"
  motor: "for gcs only, besides value: the motor score (1-6), as a whole JSON number, when stated (\"E2 V3 M4\" is motor 4)"
  unit: "the unit, when stated, else leave it out"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported"

demographics_fields:
  entity: "its name from the list above"
  value: "the number alone, as a JSON number, without its unit; an approximate value (\"about 80\") is its number; for sex, \"male\" or \"female\""
  unit: "the unit, when stated, else leave it out"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported"

mechanism_of_injury_fields:
  entity: "a short clinical description of how the injury happened, as the transcript states it — the kind of trauma (blunt, penetrating, burn, blast, ...), what caused it (a fall, a vehicle, an assault, ...) and the circumstances given (height, speed, the patient's position, ...)"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported"

medical_history_fields:
  entity: "its kind from the list above"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported; the quotes are the item's content, so quote what states the condition, medication, allergy or symptom itself"

patient_condition_fields:
  entity: "its kind from the list above"
  standard_name: "the condition in standard clinical terms (\"hip pain\", \"nausea\", \"altered level of consciousness\", \"laceration\", \"wrist deformity\", \"pelvic fracture\"); never \"normal ...\" or \"absence of ...\", since such an item is not reported"
  body_site: "the body part or region it is in, as stated (\"right hip\", \"left forearm\"); leave it out when none is stated or it is not in one place"
  quotes: "a list of one or more quotes, as plain strings in order of occurrence; each is one continuous stretch of the new segment's transcript that gives information about the entity, whether or not it names it, copied word for word, never joined from separate parts and never from the previous extractions; an item with no such quote is not reported; the quotes are the item's content, so quote what states the condition itself, including the question it answers when the answer alone does not (\"Where's the pain?\" for \"My back.\")"

# 3. Medication routes — a medication's route must be one of them (schema.py's Medication.ROUTES)
medication_routes:
  intravenous: into a vein (IV)
  intraosseous: into the bone marrow (IO)
  intramuscular: into a muscle (IM)
  subcutaneous: under the skin (SC, SQ, subcut)
  intranasal: into the nose (IN)
  inhaled: breathed in (nebulized, an inhaler)
  oral: by mouth (PO)
  sublingual: under the tongue (SL)
  buccal: against the cheek
  rectal: into the rectum (PR)
  transdermal: through the skin (a patch)

# 4. Intervention categories — the 11 categories the interventions extractor looks for; an
#    intervention must be one of them (schema.py's Intervention.CATEGORIES)
intervention_categories:
  advanced_airway: an invasive airway device placed to secure the airway
  mechanical_ventilation: breathing delivered and controlled by a ventilator
  oxygen_therapy: oxygen given by mask or nasal cannula (non-rebreather, nasal prongs) at litres per minute; never a drug or an infusion, and never the ventilator's FiO2
  chest_decompression: a needle, finger, or tube procedure to relieve or drain the chest
  ultrasound: a point of care ultrasound scan performed on the patient
  cardiac_monitoring: attaching the ECG monitor, or recording a 12-lead ECG and its findings; never a set of vital signs or a reading off the monitor
  electrical_therapy: a synchronized cardioversion or cardiac pacing delivered to the heart
  vascular_access: placing a line, a peripheral intravenous, intraosseous, central, or arterial line; never giving a drug or fluid through one
  spinal_motion_restriction: immobilization applied to limit spinal movement
  blood_product: a blood product transfused to the patient
  cardiac_arrest_care: resuscitation delivered for cardiac arrest

# 4a. The category for an item that is not an intervention — not in schema.py's
#     Intervention.CATEGORIES; the service discards items given it. Listed last in {intervention_list}.
not_an_intervention: a medication, an infusion or a change to one, a vital sign reading, the patient's condition, a handover or summary, or anything else that is not one of the procedures above; these items are discarded

# 5. Instructions — shared by every extractor
instructions:
  extraction_inputs: |
    A long encounter is extracted one transcript segment at a time. Each request gives you two inputs:
    - PREVIOUS EXTRACTIONS: what was already extracted from the earlier segments, as a JSON list of records, oldest first, each {"segment": <segment number>, "extractions": [<items, in the same form you report them, with quotes as text>]}; it is [] at the start. It is context only: use it to know what is already recorded and what the new segment refers to, and never extract from it. It may contain mistakes, so never treat its items as examples of what to report.
    - TRANSCRIPT OF THE NEW SEGMENT: the transcribed speech of the new segment. Everything you report comes from it.
  medication_inputs: |
    A long encounter is extracted one transcript segment at a time. Each request gives you two inputs:
    - PREVIOUS EXTRACTIONS: the medication administrations already extracted from the earlier segments, as a JSON list, oldest first, each with its current state: {"id", "type" ("bolus" or "infusion"), "entity", "standard_name", "dose", "dose_unit", "rate", "rate_unit", "route", "status" ("given", "running" or "stopped")}, leaving out what was never stated; it is [] at the start. It is context only: use it to know which administrations exist, by their id, and what the new segment refers to ("the ketamine", "increase it"), and never extract from it. It may contain mistakes, so never treat its items as examples of what to report.
    - TRANSCRIPT OF THE NEW SEGMENT: the transcribed speech of the new segment. Everything you report comes from it.
  quote_rule: Every item must include at least one quote, copied word for word from the new segment, that states it; if you cannot quote the new segment for an item, do not report it.
  extraction_rules: |
    Return only what the new segment states:
    - When the new segment changes or corrects one already extracted, add an item for it as the new segment now states it.
    - Do not repeat an item of the previous extractions that the new segment does not mention.
    - Base every item solely on what the new segment states, and leave any field it does not state empty.
    - {quote_rule}

# 6. Demographics — the demographics extractor; the entities are the ones
#    llm_extraction_service/schema.py accepts (Age, Sex, Weight, Height)
demographics:
  entities:
    age: the patient's age, a number, with unit "years" (or "months" or "days" for an infant)
    sex: the patient's sex, "male" or "female", with no unit
    weight: the patient's body weight, a number, with its unit as stated, e.g. "kg" or "lb"
    height: the patient's height, a number, with its unit as stated, e.g. "cm" or "ft"

# 7. Vital signs — the vital signs extractor; the entities are the ones
#    llm_extraction_service/schema.py accepts, one class each
vital_signs:
  entities:
    blood_pressure: arterial blood pressure (BP), reported as systolic and diastolic instead of value; unit "mmHg" when stated
    map: mean arterial pressure (MAP), a number; unit "mmHg" when stated
    heart_rate: heart rate or pulse (HR), a number of beats per minute
    saturation: oxygen saturation (sats, SpO2), a percentage from 0 to 100
    respiratory_rate: respiratory rate (resp rate, resps, RR), a number of breaths per minute
    end_tidal_co2: end-tidal carbon dioxide (end tidal, EtCO2), a number; unit "mmHg" when stated
    peak_pressure: peak airway pressure on a ventilator or bag, a number; unit "cmH2O" when stated
    temperature: body temperature (temp), a number, with its unit as stated, "°C" or "°F"
    gcs: Glasgow Coma Scale (GCS), the total score from 3 to 15 as value, with the eye, verbal and motor scores when stated; when only the three scores are stated, value is their sum
    glucose: blood glucose (sugar, BGL), a number, with its unit as stated, e.g. "mmol/L" or "mg/dL"

# 8. Medical history — the medical history extractor; the entities are the ones
#    llm_extraction_service/schema.py's MedicalHistory accepts
medical_history:
  entities:
    family_history: a condition in the patient's family ("his dad had a heart attack")
    patient_history: the patient's own past conditions, surgeries, allergies, or medications they took before this incident ("he's diabetic", "takes metformin"); a drug the crew gives is never medical history

# 9. Patient condition — the patient condition extractor; the entities are the ones
#     llm_extraction_service/schema.py's PatientCondition accepts
patient_condition:
  entities:
    complaint: a symptom the patient reports, such as pain and where it is ("my hip hurts", "I feel sick")
    mental_status: the patient's level of consciousness, orientation or behaviour, described in words ("drowsy", "combative", "only responds to pain", "doesn't know where she is")
    finding: an abnormal sign the crew sees, hears or feels when assessing the patient ("a cut over the eye", "the wrist looks deformed", "bruising on the right flank")
    suspected_injury: an injury, or an injured body region, the crew suspects or is treating as injured until cleared, including their working impression ("possible spinal injury", "query pelvic fracture")

