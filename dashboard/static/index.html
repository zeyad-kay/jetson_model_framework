<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trauma Timeline</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="monitor">
    <header class="top">
      <div class="card patient" id="patient" title="Demographics">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
        <span id="patient-text">–</span>
      </div>
      <div class="card mechanism">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11h1a1 1 0 0 1 1 1v5h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3v-5a1 1 0 0 1 1-1zm2.2 0h9.6l-1.2-3.3a.5.5 0 0 0-.5-.3H8.9a.5.5 0 0 0-.5.3z"/></svg>
        <div class="mechanism-text">
          <div class="mechanism-title" id="mechanism-title">No mechanism of injury yet</div>
          <div class="mechanism-sub" id="mechanism-sub"></div>
        </div>
      </div>
      <div class="card status" id="status" data-state="none">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 13a7 7 0 0 1 5 2.1l-1.4 1.4A5 5 0 0 0 12 15a5 5 0 0 0-3.6 1.5L7 15.1A7 7 0 0 1 12 13zm0-4.5c3.2 0 6.1 1.3 8.2 3.4l-1.4 1.4A9.6 9.6 0 0 0 12 10.5c-2.7 0-5.1 1.1-6.8 2.8l-1.4-1.4A11.6 11.6 0 0 1 12 8.5zM12 4c4.4 0 8.4 1.8 11.3 4.7l-1.4 1.4A14 14 0 0 0 12 6 14 14 0 0 0 2.1 10.1L.7 8.7A16 16 0 0 1 12 4z"/></svg>
        <span id="status-text">No session</span>
      </div>
      <label class="card session-picker">
        <span class="label">Session</span>
        <select id="session-select" aria-label="Session"></select>
      </label>
    </header>

    <section class="injuries" aria-labelledby="injuries-heading">
      <h2 id="injuries-heading">Injuries</h2>
      <div class="panel">
        <p class="panel-note">Injury-related general notes (keyword matches)</p>
        <ol class="injury-list" id="injury-list"></ol>
        <p class="empty" id="injuries-empty">No injuries mentioned yet.</p>
      </div>
    </section>

    <section class="timeline" aria-labelledby="timeline-heading">
      <div class="section-head">
        <h2 id="timeline-heading">Patient timeline</h2>
        <div class="timeline-controls">
          <span class="range" id="range"></span>
          <div class="zoom" role="group" aria-label="Visible span">
            <button type="button" data-window="600">10 min</button>
            <button type="button" data-window="1200" aria-pressed="true">20 min</button>
            <button type="button" data-window="3600">1 h</button>
            <button type="button" data-window="0">All</button>
          </div>
          <button type="button" class="follow" id="follow" aria-pressed="true" title="Keep the latest events in view">Follow</button>
        </div>
      </div>
      <div class="panel timeline-panel">
        <div class="lanes-scroll" id="lanes-scroll">
          <div class="lanes" id="lanes"></div>
        </div>
        <div class="axis-wrap"><div class="axis" id="axis"></div></div>
        <p class="empty timeline-empty" id="timeline-empty">Waiting for the first aggregate…</p>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
