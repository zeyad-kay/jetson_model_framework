services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: true
    # depends_on:
    #   asr_service:
    #     condition: service_healthy
    volumes:
      - type: bind
        source: ./sessions
        target: ${SESSIONS_DIR:-/sessions}
      - type: bind
        source: ./logs
        target: ${LOGS_DIR:-/logs}
      - type: bind
        source: ./run
        target: ${BRIDGE_DIR:-/run/bridge}
      # Code is mounted over the copy baked into the image; restart the service to pick up edits.
      - type: bind
        source: ./common
        target: /app/common
        read_only: true
      - type: bind
        source: ./server
        target: /app/server
        read_only: true
    # Host networking so the server sees the address clients reach it at (the
    # hotspot's) and can hand back a publish URL that works. It listens on 8000
    # (control) and 8554 (RTSP).
    network_mode: host

  asr_service:
    build:
      context: .
      dockerfile: asr_service/Dockerfile
    # restart: unless-stopped
    # SIGTERM makes the service finish the current session's remaining audio before exiting.
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: true
    environment:
      # Torch's pip cuDNN (9.20) mixes with the host-injected one (9.21) and fails with
      # SUBLIBRARY_VERSION_MISMATCH; put the system copy first so only it is loaded.
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    # healthcheck:
      # Healthy once the bridge answers a ping with a pong (socket = $BRIDGE_DIR/asr_service.sock).
      # test:
      #   - CMD
      #   - python
      #   - -c
      #   - 'import socket,json;s=socket.socket(socket.AF_UNIX);s.settimeout(2);s.connect("/run/bridge/asr_service.sock");s.sendall(b"{\"command\":\"ping\"}\n");r=json.loads(s.makefile("rb").readline());raise SystemExit(0 if r.get("reply")=="pong" else 1)'
      # interval: 5s
      # timeout: 3s
      # retries: 5
      # start_period: 10s
    volumes:
      - type: bind
        source: ./sessions
        target: ${SESSIONS_DIR:-/sessions}
      - type: bind
        source: ./logs
        target: ${LOGS_DIR:-/logs}
      - type: bind
        source: ./run
        target: ${BRIDGE_DIR:-/run/bridge}
      # Code is mounted over the copy baked into the image; restart the service to pick up edits.
      - type: bind
        source: ./common
        target: /app/common
        read_only: true
      - type: bind
        source: ./asr_service
        target: /app/asr_service
        read_only: true

  llm_extraction_service:
    build:
      context: .
      dockerfile: llm_extraction_service/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # Torch's pip cuDNN (9.20) mixes with the host-injected one (9.21) and fails with
      # SUBLIBRARY_VERSION_MISMATCH; put the system copy first so only it is loaded.
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      - type: bind
        source: ./sessions
        target: ${SESSIONS_DIR:-/sessions}
      - type: bind
        source: ./logs
        target: ${LOGS_DIR:-/logs}
      - type: bind
        source: ./run
        target: ${BRIDGE_DIR:-/run/bridge}
      # Code is mounted over the copy baked into the image; restart the service to pick up edits.
      - type: bind
        source: ./common
        target: /app/common
        read_only: true
      - type: bind
        source: ./llm_extraction_service
        target: /app/llm_extraction_service
        # read_only: true

  llm_aggregation_service:
    build:
      context: .
      dockerfile: llm_aggregation_service/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # Torch's pip cuDNN (9.20) mixes with the host-injected one (9.21) and fails with
      # SUBLIBRARY_VERSION_MISMATCH; put the system copy first so only it is loaded.
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      - type: bind
        source: ./sessions
        target: ${SESSIONS_DIR:-/sessions}
      - type: bind
        source: ./logs
        target: ${LOGS_DIR:-/logs}
      - type: bind
        source: ./run
        target: ${BRIDGE_DIR:-/run/bridge}
      # Code is mounted over the copy baked into the image; restart the service to pick up edits.
      - type: bind
        source: ./common
        target: /app/common
        read_only: true
      - type: bind
        source: ./llm_aggregation_service
        target: /app/llm_aggregation_service
        read_only: true

  video_service:
    build:
      context: .
      dockerfile: video_service/Dockerfile
    # restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # Torch's pip cuDNN (9.20) mixes with the host-injected one (9.21) and fails with
      # SUBLIBRARY_VERSION_MISMATCH; put the system copy first so only it is loaded.
      LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    volumes:
      - type: bind
        source: ./sessions
        target: ${SESSIONS_DIR:-/sessions}
      - type: bind
        source: ./logs
        target: ${LOGS_DIR:-/logs}
      - type: bind
        source: ./run
        target: ${BRIDGE_DIR:-/run/bridge}
      # Code is mounted over the copy baked into the image; restart the service to pick up edits.
      - type: bind
        source: ./common
        target: /app/common
        read_only: true
      - type: bind
        source: ./video_service
        target: /app/video_service
        read_only: true

  # Web dashboard of a session's ePCR timeline (dashboard/), read-only over the sessions folder.
  # Open http://<jetson-ip>:${DASHBOARD_PORT:-8080}/ in a browser.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - type: bind
        source: ./sessions
        target: ${SESSIONS_DIR:-/sessions}
        read_only: true
      - type: bind
        source: ./logs
        target: ${LOGS_DIR:-/logs}
      # Code is mounted over the copy baked into the image; restart the service to pick up edits.
      - type: bind
        source: ./common
        target: /app/common
        read_only: true
      - type: bind
        source: ./dashboard
        target: /app/dashboard
        read_only: true
    # Host networking, like the server, so the page is reachable at the Jetson's address.
    network_mode: host

  # Test clients, built from tests/Dockerfile. Only started on demand (profile "test").
  # Mock streaming client (tests/e2e/main.py): streams through the server, e.g.:
  #   docker compose run --rm e2e_test --mode audio    # or --mode video / --mode both
  e2e_test:
    profiles: ["test"]
    build:
      context: ./tests
      dockerfile: Dockerfile
    image: jetson_model_framework-tests
    entrypoint: ["python3", "/tests/e2e/main.py"]
    volumes:
      # Mounted over the baked-in copy so edits apply without a rebuild.
      - type: bind
        source: ./tests/e2e
        target: /tests/e2e
        read_only: true
      # The test media, shared with the integration tests.
      - type: bind
        source: ./tests/integration
        target: /tests/integration
        read_only: true
      # Where the client writes its log (tests/integration/testlog.py).
      - type: bind
        source: ./logs/tests
        target: /logs/tests
    # Host networking so the default --host 127.0.0.1 reaches the server on this machine.
    network_mode: host

  # Per-service integration tests: each drives one service directly over its bridge
  # socket, without the server, and checks its output. Needs the service running:
  #   docker compose run --rm asr_test       # asr_service
  #   docker compose run --rm video_test     # video_service
  #   docker compose run --rm llm_extraction_test    # llm_extraction_service
  #   docker compose run --rm llm_aggregation_test   # llm_aggregation_service
  asr_test: &service_test
    profiles: ["test"]
    image: jetson_model_framework-tests
    entrypoint: ["python3", "/tests/integration/asr/main.py"]
    volumes:
      - type: bind
        source: ./tests/integration
        target: /tests/integration
        read_only: true
      - type: bind
        source: ./sessions
        target: /sessions
      - type: bind
        source: ./run
        target: /run/bridge
      - type: bind
        source: ./logs
        target: /logs
        read_only: true
      # Writable, unlike the services' logs above: where the test writes its own log
      # (tests/integration/testlog.py).
      - type: bind
        source: ./logs/tests
        target: /logs/tests

  video_test:
    <<: *service_test
    entrypoint: ["python3", "/tests/integration/video/main.py"]

  llm_extraction_test:
    <<: *service_test
    entrypoint: ["python3", "/tests/integration/extraction/main.py"]

  llm_aggregation_test:
    <<: *service_test
    entrypoint: ["python3", "/tests/integration/aggregation/main.py"]
